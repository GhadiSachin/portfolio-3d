<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Dark Theme Architectural Background -->
  <rect width="600" height="600" fill="#0f172a" />
  
  <defs>
    <!-- Background Tech Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
    
    <!-- Neon Cloud/AI Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Apply Grid -->
  <rect width="600" height="600" fill="url(#grid)" />

  <!-- Code Bracket Left -->
  <path d="M 160 200 L 100 250 L 160 300" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Code Bracket Right -->
  <path d="M 440 200 L 500 250 L 440 300" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Abstract Data Node Connection -->
  <circle cx="280" cy="140" r="4" fill="#06b6d4" />
  <path d="M 280 140 L 280 170 L 320 170" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5" />

  <!-- Unique Monogram 'S G' -->
  <text x="47%" y="45%" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" text-anchor="middle" dominant-baseline="middle" letter-spacing="15">
    <tspan fill="#f8fafc">S</tspan><tspan fill="url(#neonGradient)">G</tspan>
  </text>

  <!-- Terminal Prompt Accent -->
  <text x="245" y="370" font-family="monospace" font-size="34" font-weight="bold" fill="url(#neonGradient)">></text>
  <text x="275" y="365" font-family="monospace" font-size="34" font-weight="bold" fill="#f8fafc">_</text>

  <!-- Full Name -->
  <text x="50%" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="8" fill="#f8fafc">SACHIN GHADI</text>

  <!-- Professional Title -->
  <text x="50%" y="500" font-family="monospace" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="5" fill="#94a3b8">TECHNICAL ARCHITECT</text>
  
  <!-- Decorative Bottom Line -->
  <line x1="250" y1="530" x2="350" y2="530" stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" />
</svg>
